<body>
  <header class="topbar">
    <span class="brand">Babirl Runcon GUI</span>
    <a class="button small primary experiment-list-link" href="/">Experiment list</a><div id="top-experiment" hidden></div><div class="top-right"><div id="top-connections" class="actions" hidden></div><a id="top-edit-config" class="button small" hidden>Edit configuration</a><span class="top-version">V1</span></div>

      <h2 id="confirm-title">Confirm operation</h2><p id="confirm-message"></p>
      <div class="actions end"><button value="cancel" class="button">Cancel</button><button value="confirm" class="button primary" id="confirm-button">Confirm</button></div>
